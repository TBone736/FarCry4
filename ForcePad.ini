; FC4 ForcePad settings. 1 = on, 0 = off.
; Changes take effect the next time you start the game.
[ForcePad]

; Master switch. 0 = the DLL just passes everything through untouched.
Enabled=1

; Hide keyboard input from the game (this stops the space bar / Esc prompts).
BlockKeyboard=1

; Hide mouse, touchpad and gyro-mouse input from the game.
BlockMouse=1

; Make the game always see the mouse cursor in the same spot, so menus
; don't jump to whatever the cursor is hovering over.
FreezeCursor=1

; Move the Windows cursor to the bottom-right corner when the game window appears.
ParkCursor=1

; Which XInput slot holds your controller. -1 = auto (first connected controller).
; Set 0-3 to force one if auto picks the wrong device.
PadSlot=-1

; Show the game only one controller (player 1). Stops a "ghost" virtual pad
; from Steam, Legion Space or similar from taking over.
HideOtherPads=1

; Hold LB + RB + View (the two-squares button) for 1.5 seconds to switch
; keyboard/mouse blocking on or off while playing. You'll hear a beep.
ToggleCombo=1

; Write ForcePad.log next to the DLL (handy if something doesn't work).
Log=1
